<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>Local — Виртуальный каталог</title>
  <meta name="description" content="Виртуальный журнал-каталог магазина Local. Листайте как настоящий журнал." />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="topbar" role="banner">
    <div class="topbar__left">
      <button class="iconbtn" id="btnHome" type="button" title="На обложку">
        <span class="icon">⌂</span>
      </button>

      <button class="iconbtn" id="btnThumbs" type="button" title="Миниатюры">
        <span class="icon">▦</span>
      </button>
    </div>

    <div class="brand" aria-label="Local">
      <div class="brand__mark" aria-hidden="true">✦</div>
      <div class="brand__text">
        <div class="brand__name" id="brandName">LOCAL</div>
        <div class="brand__tag" id="brandTag">виртуальный каталог</div>
      </div>
    </div>

    <div class="topbar__right">
      <button class="iconbtn" id="btnTheme" type="button" title="Тема: светлая/тёмная" aria-pressed="false">
        <span class="icon" id="themeIcon">☾</span>
      </button>

      <a class="iconbtn iconbtn--link" id="btnShop" href="#" target="_blank" rel="noreferrer" title="Сайт магазина">
        <span class="icon">↗</span>
      </a>
    </div>
  </header>

  <main class="stage" role="main">
    <section class="viewer" id="viewer" aria-label="Каталог">
      <div class="viewer__chrome">
        <div class="page-indicator" id="pageIndicator" aria-live="polite">1 / 1</div>

        <div class="jump" aria-label="Быстрый переход по страницам">
          <input
            class="jump__range"
            id="pageRange"
            type="range"
            min="1"
            max="1"
            value="1"
            step="1"
            aria-label="Номер страницы"
          />
          <div class="jump__meta">
            <span class="jump__label">Страница</span>
            <span class="jump__value" id="pageRangeLabel">1</span>
          </div>
        </div>
      </div>

      <div class="book" id="book"></div>

      <button class="nav nav--prev" id="btnPrev" type="button" aria-label="Предыдущая страница">
        <span class="nav__chev">‹</span>
      </button>
      <button class="nav nav--next" id="btnNext" type="button" aria-label="Следующая страница">
        <span class="nav__chev">›</span>
      </button>

      <div class="hint" id="hint">Листайте стрелками, клавишами ← → или свайпом</div>
    </section>

    <aside class="thumbs" id="thumbs" aria-label="Миниатюры">
      <div class="thumbs__head">
        <div class="thumbs__title">Страницы</div>

        <div class="thumbs__search">
          <input id="thumbsSearch" type="search" placeholder="Поиск по каталогу…" autocomplete="off" />
        </div>

        <button class="iconbtn" id="btnThumbsClose" type="button" title="Закрыть">
          <span class="icon">✕</span>
        </button>
      </div>

      <div class="thumbs__grid" id="thumbsGrid"></div>
    </aside>
  </main>

  <footer class="footer">
    <div class="footer__left">
      <span id="footerCopyright">© <span id="year"></span> Local</span>
    </div>
    <div class="footer__right">
      <span class="kbd">←</span><span class="kbd">→</span>
      <span class="footer__sep">•</span>
      <span class="kbd">Esc</span> закрыть
    </div>
  </footer>

  <div class="modal" id="productModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Карточка товара">
    <div class="modal__backdrop" data-close="true"></div>

    <div class="modal__panel" role="document">
      <div class="modal__head">
        <div class="modal__title" id="modalTitle">Товар</div>
        <button class="iconbtn" id="btnModalClose" type="button" title="Закрыть">
          <span class="icon">✕</span>
        </button>
      </div>

      <div class="modal__body">
        <div class="modal__media">
          <img id="modalImage" alt="" />
        </div>

        <div class="modal__info">
          <div class="modal__price" id="modalPrice"></div>
          <div class="modal__text" id="modalText"></div>

          <div class="modal__actions">
            <a class="btn" id="modalLink" href="#" target="_blank" rel="noreferrer">Открыть на сайте</a>
            <button class="btn btn--ghost" id="btnCopy" type="button">Скопировать название</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
